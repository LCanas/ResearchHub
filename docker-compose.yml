# Collaboration Hub: web app + PostgreSQL, with data on persistent volumes.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up -d --build
#
# Data lives in the named volumes below, so it survives rebuilding or
# replacing the containers. Only `docker compose down -v` would delete it.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the web container can reach it.

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@db:5432/hub
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    volumes:
      - uploads:/app/hub/static/uploads      # profile photos
    ports:
      - "${HUB_PORT:-8000}:8000"

volumes:
  pgdata:
  uploads:
