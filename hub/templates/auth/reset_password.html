<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · {{ APP_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-brand">
    <span class="brand-mark" style="margin-bottom:1.2rem">CH</span>
    <h1>{{ APP_NAME }}</h1>
    <p style="font-size:1.05rem">{{ APP_SUBTITLE }} — King's College London.</p>
  </div>
  <div class="auth-panel">
    <div class="auth-card card card-pad">
      <h2>Choose a new password</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.reset_password_with_token', token=token) }}">
        <div class="form-row">
          <label>New password <span class="hint">(at least 6 characters)</span></label>
          <input type="password" name="password" required minlength="6" autofocus autocomplete="new-password">
        </div>
        <div class="form-row">
          <label>Confirm new password</label>
          <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Set new password</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
