{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block body %}
<div class="container main" style="max-width:520px">
  <h1>Change password</h1>
  {% if current_user.must_change_password %}
    <div class="flash flash-info">Your password was reset by an administrator. Enter the temporary
      password you were given, then choose your own.</div>
  {% endif %}
  <form method="post" action="{{ url_for('main.change_password') }}" class="card card-pad mt">
    <div class="form-row">
      <label>{{ 'Temporary password' if current_user.must_change_password else 'Current password' }}</label>
      <input type="password" name="current" required autofocus autocomplete="current-password">
    </div>
    <div class="form-row">
      <label>New password <span class="hint">(at least 6 characters)</span></label>
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-row">
      <label>Confirm new password</label>
      <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
    </div>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
