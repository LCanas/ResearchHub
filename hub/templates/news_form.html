{% extends "base.html" %}
{% block title %}New announcement{% endblock %}

{% block body %}
<div class="container main" style="max-width:720px">
  <div class="section-title">
    <h1>New announcement</h1>
    <a class="btn btn-ghost" href="{{ url_for('main.news') }}">Cancel</a>
  </div>

  <form method="post" action="{{ url_for('main.news_new') }}" class="card card-pad">
    <div class="form-row">
      <label>Title</label>
      <input name="title" required autofocus>
    </div>
    <div class="form-row">
      <label>Body</label>
      <textarea name="body" style="min-height:160px" placeholder="Share an update with the hub…"></textarea>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Link to a hub page <span class="hint">(adds a button)</span></label>
        <select name="link_page">
          <option value="">None</option>
          {% for label, endpoint in NEWS_LINK_PAGES %}<option value="{{ endpoint }}">{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label>…or another web address <span class="hint">(optional)</span></label>
        <input name="link_custom" placeholder="https://… or /events/3">
      </div>
      <div class="form-row full">
        <label>Button text <span class="hint">(optional)</span></label>
        <input name="link_label" maxlength="80" placeholder="e.g. Submit a challenge">
      </div>
      <div class="form-row">
        <label>Second button <span class="hint">(optional)</span></label>
        <select name="link2_page">
          <option value="">None</option>
          {% for label, endpoint in NEWS_LINK_PAGES %}<option value="{{ endpoint }}">{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label>…or another web address</label>
        <input name="link2_custom" placeholder="https://… or /events/3">
      </div>
      <div class="form-row full">
        <label>Second button text <span class="hint">(optional)</span></label>
        <input name="link2_label" maxlength="80" placeholder="e.g. About the day">
      </div>
      <div class="form-row">
        <label>Related workstream <span class="hint">(optional)</span></label>
        <select name="workstream">
          <option value="">None</option>
          {% for w in WORKSTREAMS %}<option value="{{ w.name }}">{{ w.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-row" style="justify-content:flex-end">
        <label class="flex small" style="margin-top:1.4rem">
          <input type="checkbox" name="pinned" style="width:auto"> Pin to top
        </label>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">Publish</button>
  </form>
</div>
{% endblock %}
